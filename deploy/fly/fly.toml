app = "soft-yes"
primary_region = "arn"

[env]
  SOFTYES_DB = "/data/cache.db"
  SOFTYES_SEED = "/app/seed.db"
  SOFTYES_PUBLIC_URL = "https://soft-yes.fly.dev"

[mounts]
  source = "softyes_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
