app = "soft-yes"
primary_region = "arn"

[build]
  image = "caddy:2-alpine"

[[files]]
  guest_path = "/etc/caddy/Caddyfile"
  local_path = "Caddyfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
